name: 自动打包发布

on:
  workflow_dispatch:   # ✅ 手动点击运行

jobs:
  build-windows:
    runs-on: windows-latest

    # 增加权限声明，确保脚本有权创建 Release
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 执行打包命令
        # 建议增加 --no-configuration-cache 避免 GitHub 环境下的序列化报错
        run: ./gradlew :composeApp:packageMsi --no-configuration-cache

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          # --- 核心修改点 ---
          # 手动运行时没有 tag，我们强制指定一个 tag 名称
          # 你也可以改成 "v${{ github.run_number }}" 让每次运行的 tag 都不一样
          tag_name: "v1.0.0-release"
          name: "AutoFill v1.0.0 (Build ${{ github.run_number }})"
          body: |
            这是由 GitHub Actions 自动生成的安装包。
            构建编号: ${{ github.run_number }}
            提交分支: ${{ github.ref_name }}
          draft: false
          prerelease: false
          # 如果 tag 已存在，则覆盖更新里面的文件
          make_latest: true
          files: |
            composeApp/build/compose/binaries/main/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}