name: 自动打包发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (请填入新的版本号，例如 v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  # ==========================================
  # 阶段一：并行构建安装包
  # ==========================================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            artifact_name: windows-app
            artifact_path: composeApp/build/compose/binaries/main/msi/*.msi
            release_name: AutoFill-${{ github.event.inputs.version }}-Windows-x64.msi
          - os: macos-latest
            task: packageDmg
            artifact_name: macos-app
            artifact_path: composeApp/build/compose/binaries/main/dmg/*.dmg
            release_name: AutoFill-${{ github.event.inputs.version }}-macOS-x64.dmg
          - os: ubuntu-latest
            task: packageDeb
            artifact_name: linux-app
            artifact_path: composeApp/build/compose/binaries/main/deb/*.deb
            release_name: AutoFill-${{ github.event.inputs.version }}-Ubuntu-x64.deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: 配置 Gradle 环境与缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 赋予脚本执行权限
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: 执行打包命令
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
        # 修复点 1：显式加入 createDistributable 任务，强制 100% 生成 app 目录，防止被插件清理
        run: ./gradlew :composeApp:createDistributable :composeApp:${{ matrix.task }} --stacktrace

      - name: 提取并重命名安装包
        shell: bash
        run: |
          mkdir -p release-pkg
          mv ${{ matrix.artifact_path }} release-pkg/${{ matrix.release_name }}

      - name: 【Windows专属】生成 Zip 便携版
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # 修复点 2：先把丑陋的 app 文件夹改名为 AutoFill，再打包整个文件夹。避免解压后文件散落一地。
          Rename-Item -Path "composeApp/build/compose/binaries/main/app" -NewName "AutoFill"
          Compress-Archive -Path "composeApp/build/compose/binaries/main/AutoFill" -DestinationPath "release-pkg/AutoFill-${{ github.event.inputs.version }}-Windows-x64.zip"

      - name: 暂存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-pkg/*
          if-no-files-found: error

  # ==========================================
  # 阶段二：统一发布到 Release
  # ==========================================
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "AutoFill ${{ github.event.inputs.version }}"
          body: |
            ### 🚀 AutoFill 全平台发布
            
            #### 📥 下载指南
            - **Windows 用户**：提供 `.msi` 安装包及 `.zip` 便携版。
            - **macOS 用户**：下载 `.dmg` 文件安装。
            - **Linux 用户**：下载 `.deb` 包安装。
            
            *构建时间: ${{ github.event.repository.updated_at }}*
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}