name: 自动打包发布

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # 同时启动三台不同系统的虚拟机进行打包
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: 赋予脚本执行权限
        # 解决了 Linux/Mac 下 ./gradlew 的权限问题
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: 执行打包命令
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./gradlew :composeApp:packageMsi --no-configuration-cache --no-daemon
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            ./gradlew :composeApp:packageDmg --no-configuration-cache --no-daemon
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            ./gradlew :composeApp:packageDeb --no-configuration-cache --no-daemon
          fi

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          # 固定版本标签和名称
          tag_name: "v1.0.0"
          name: "自动填充 v1.0.0"
          body: |
            ### 🚀 AutoFill 全平台发布
            - **Windows**: .msi 安装包
            - **macOS**: .dmg 镜像文件
            - **Linux**: .deb 安装包
            
            *构建时间: ${{ github.event.repository.updated_at }}*
          draft: false
          prerelease: false
          # 设为 true 确保它始终是最新的 Release
          make_latest: true
          # 关键：设置为 false，因为每台机器只能看到自己平台的产物，看不到其他平台的
          fail_on_unmatched_files: false
          files: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/dmg/*.dmg
            composeApp/build/compose/binaries/main/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}