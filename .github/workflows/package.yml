name: 自动打包发布 (全平台)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # 定义三个运行环境
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: 执行打包命令 (根据系统选择命令)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./gradlew :composeApp:packageMsi --no-configuration-cache
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            # 注意：打包 DMG 记得之前说的版本号主版本号要 > 0
            ./gradlew :composeApp:packageDmg --no-configuration-cache
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            ./gradlew :composeApp:packageDeb --no-configuration-cache
          fi

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-release"
          name: "AutoFill v1.0.0"
          # 关键：这里匹配所有平台生成的安装包路径
          files: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/dmg/*.dmg
            composeApp/build/compose/binaries/main/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}