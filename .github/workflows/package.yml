name: 自动打包发布 (全平台)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # 同时启动三台不同系统的虚拟机
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: 执行打包命令
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./gradlew :composeApp:packageMsi --no-configuration-cache
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            ./gradlew :composeApp:packageDmg --no-configuration-cache
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            ./gradlew :composeApp:packageDeb --no-configuration-cache
          fi

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          # 固定 Tag 和名称，不再引用 run_number
          tag_name: "v1.0.0"
          name: "自动填充 v1.0.0"
          body: "AutoFill 全平台正式发布版本。"
          draft: false
          prerelease: false
          # 这样如果你多次手动运行，它会更新现有的 Release 而不是报错
          make_latest: true
          files: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/dmg/*.dmg
            composeApp/build/compose/binaries/main/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}