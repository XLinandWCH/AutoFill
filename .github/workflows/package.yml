name: 自动打包发布

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # 同时启动三台不同系统的虚拟机进行打包
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: 赋予脚本执行权限
        # 这一步解决了 Linux/Mac 下的 Permission denied 报错
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: 执行打包命令
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./gradlew :composeApp:packageMsi --no-configuration-cache
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            ./gradlew :composeApp:packageDmg --no-configuration-cache
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            ./gradlew :composeApp:packageDeb --no-configuration-cache
          fi

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          # 固定版本号，不再显示“第5版”等字样
          tag_name: "v1.0.0"
          name: "自动填充 v1.0.0"
          body: "AutoFill 正式发布版本。"
          draft: false
          prerelease: false
          # 如果多次运行，会自动覆盖更新同一个 Release 里的文件
          make_latest: true
          files: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/dmg/*.dmg
            composeApp/build/compose/binaries/main/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}