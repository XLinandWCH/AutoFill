name: 自动打包发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (请填入新的版本号，例如 v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  # ==========================================
  # 阶段一：并行构建 Native 安装包与分发产物
  # ==========================================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            artifact_name: windows-app
            artifact_path: composeApp/build/compose/binaries/main/msi/*.msi
            release_name: AutoFill-${{ github.event.inputs.version }}-Windows-x64.msi
          - os: macos-latest
            task: packageDmg
            artifact_name: macos-app
            artifact_path: composeApp/build/compose/binaries/main/dmg/*.dmg
            release_name: AutoFill-${{ github.event.inputs.version }}-macOS-x64.dmg
          - os: ubuntu-latest
            task: packageDeb
            artifact_name: linux-app
            artifact_path: composeApp/build/compose/binaries/main/deb/*.deb
            release_name: AutoFill-${{ github.event.inputs.version }}-Ubuntu-x64.deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: 配置 Gradle 环境与缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 赋予脚本执行权限
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: 执行 Native 打包命令
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
        # 显式按顺序执行：先创建完整的二进制分发目录，再打包成对应的系统原生安装包
        run: ./gradlew :composeApp:createDistributable :composeApp:${{ matrix.task }} --stacktrace

      - name: 提取并重命名 Native 安装包
        shell: bash
        run: |
          mkdir -p release-pkg
          mv ${{ matrix.artifact_path }} release-pkg/${{ matrix.release_name }}

      - name: 【Windows 专属】生成 Native Zip 便携版
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # 确保临时工作目录干净
          if (Test-Path "composeApp/build/compose/binaries/main/AutoFill") { Remove-Item -Recurse -Force "composeApp/build/compose/binaries/main/AutoFill" }
          
          # 关键修复：从独立的 app 预打包目录复制出来，重命名为 AutoFill
          Copy-Item -Path "composeApp/build/compose/binaries/main/app" -Destination "composeApp/build/compose/binaries/main/AutoFill" -Recurse
          
          # 压缩成绿色便携包（内部自带精简后的 runtime 运行环境，纯正 Native 体验）
          Compress-Archive -Path "composeApp/build/compose/binaries/main/AutoFill" -DestinationPath "release-pkg/AutoFill-${{ github.event.inputs.version }}-Windows-x64.zip"

      - name: 暂存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-pkg/*
          if-no-files-found: error

  # ==========================================
  # 阶段二：统一发布到 Release
  # ==========================================
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "AutoFill ${{ github.event.inputs.version }}"
          body: |
            ### 🚀 AutoFill 全平台 Native 发布
            
            #### 📥 下载指南
            - **Windows 用户**：提供 `.msi` 独立安装包及 `.zip` 绿色便携版（免安装，解压即用）。
            - **macOS 用户**：下载 `.dmg` 文件双击拖拽安装。
            - **Linux 用户**：下载 `.deb` 包使用包管理器安装。
            
            *所有版本均已内置运行时环境，用户无需额外安装 Java/JRE。*
            
            ---
            *构建时间: ${{ github.event.repository.updated_at }}*
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}